# /etc/iptables.conf — IPv4 packet filter, restored by /etc/init.d/S35iptables
# at boot (iptables-restore format; '#' comments must start the line).
#
# Default-deny INPUT. Every ACCEPT below corresponds to a service documented in
# the per-product Annex II fact sheets (docs/compliance/cra-annex2-facts.md) —
# if a port is not in those sheets it must not be opened here, and vice versa.
#
# FORWARD is DROP: the unit routes nothing. The media-gateway br0 T1S bridge is
# unaffected — it switches at L2 and CONFIG_BRIDGE_NETFILTER is not built, so
# bridged frames never traverse this chain. CAN traffic (AF_CAN) is not IP and
# is not filtered here either; the CAN write path is guarded by the :8001 rule.
*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT ACCEPT [0:0]
# Loopback carries the console backends (httpd on 127.0.0.1:18080/:18081
# behind stunnel) — must stay open, and keeping it here means the loopback
# bind and the firewall fail independently.
-A INPUT -i lo -j ACCEPT
# Replies to our own outbound traffic (MQTT, Modbus TCP, EtherNet/IP explicit
# messaging, LLM HTTPS, NTP, DNS).
-A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
-A INPUT -m conntrack --ctstate INVALID -j DROP
# Diagnostics: answer ping, but bounded so a flood cannot busy the CPU.
-A INPUT -p icmp --icmp-type echo-request -m limit --limit 5/second --limit-burst 10 -j ACCEPT
# IGMP membership queries: without answering these, an IGMP-snooping switch
# prunes us from multicast groups and mDNS (satisense.local) goes dark.
-A INPUT -p igmp -j ACCEPT
# DHCP client lease traffic. Initial discovery uses packet sockets that bypass
# netfilter, but renewals arrive on the UDP socket; this rule keeps the lease
# path independent of dhcpcd internals.
-A INPUT -p udp --sport 67 --dport 68 -j ACCEPT
# mDNS (avahi): publishes satisense.local so the OPC UA certificate's DNS SANs
# survive a DHCP lease change (ADR-147).
-A INPUT -p udp --dport 5353 -j ACCEPT
# sshd (key-only, PermitRootLogin prohibit-password).
-A INPUT -p tcp --dport 22 -j ACCEPT
# media-gateway console: stunnel HTTPS, plain-HTTP fallback on the same port.
-A INPUT -p tcp --dport 443 -j ACCEPT
# SatiSense Edge console: stunnel HTTPS, plain-HTTP fallback on the same port.
-A INPUT -p tcp --dport 8080 -j ACCEPT
# SatiSense Edge OPC UA server (Sign&Encrypt by default).
-A INPUT -p tcp --dport 4840 -j ACCEPT
# media-gateway CAN<->Ethernet gateway (comm_port+1; unauthenticated by
# protocol design — reaching this port is bus access, so connects are audited).
-A INPUT -p tcp --dport 8001 -j ACCEPT
-A INPUT -p udp --dport 8001 -j ACCEPT
# EtherNet/IP Class 1 implicit I/O (UDP 2222) is NOT opened: the scanner is
# currently used for explicit messaging (TCP, outbound, covered by conntrack).
# If implicit I/O connections are ever commissioned, uncomment:
# -A INPUT -p udp --dport 2222 -j ACCEPT
COMMIT
