# /etc/ip6tables.conf — IPv6 packet filter, restored by /etc/init.d/S35iptables.
#
# Both products are deployed on IPv4 control networks and the Annex II fact
# sheets list IPv4 listeners only — but several daemons bind dual-stack
# sockets, so without this filter every console and OPC UA port was silently
# reachable over IPv6 link-local, outside what the documentation states.
# Policy: no service is offered over IPv6.
#
# Router Advertisements are deliberately dropped (not in the NDP allowance
# below): the device must not autoconfigure a global IPv6 address from the
# wire, and dhcpcd runs ipv4only so its RA parser (CVE-2026-56116) never
# receives input. Neighbor Solicitation/Advertisement stay open so the
# link-local address remains well-behaved on the segment.
*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT ACCEPT [0:0]
-A INPUT -i lo -j ACCEPT
-A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
-A INPUT -m conntrack --ctstate INVALID -j DROP
# NDP neighbor resolution (NS/NA). RA (134) and RS (133) intentionally absent.
-A INPUT -p ipv6-icmp --icmpv6-type 135 -j ACCEPT
-A INPUT -p ipv6-icmp --icmpv6-type 136 -j ACCEPT
COMMIT
