# Board override of the stock buildroot dhcpcd.conf.
# Both products deploy on IPv4 control networks; IPv6 is disabled here so
# dhcpcd never opens its Router Advertisement socket (its RA route-information
# parser is CVE-2026-56116 territory) and never autoconfigures an address the
# Annex II fact sheets do not document. The ip6tables ruleset drops inbound
# RAs as well — this line is what makes the parser unreachable even if the
# filter fails to load.
ipv4only

# dhcpcd claims every interface by default, including AF_CAN ones: on a unit
# with can0 up it ran DHCP against the CAN bus, looping "if_setmtu: Device or
# resource busy" plus privilege-separation errors in syslog (found on the
# 2026-08-12/13 MQTT TLS bench). Harmless in itself, but a log full of errors
# that are not real makes a genuine fault harder to see. The glob also covers
# a second controller or a vcan test interface.
denyinterfaces can*

# The media-gateway console appends its managed static-IP block below this
# file's contents at runtime; keep this file to daemon-wide options only.

# Use the same DUID + IAID as set in DHCPv6 for DHCPv4 ClientID as per RFC4361.
duid

# Persist interface configuration when dhcpcd exits.
persistent

# vendorclassid is set to blank to avoid sending the default of
# dhcpcd-<version>:<os>:<machine>:<platform>
vendorclassid

# A list of options to request from the DHCP server.
option domain_name_servers, domain_name, domain_search
option classless_static_routes
# Respect the network MTU. This is applied to DHCP routes.
option interface_mtu

# Request a hostname from the network
option host_name

# Rapid commit support.
# Safe to enable by default because it requires the equivalent option set
# on the server to actually work.
option rapid_commit

# A ServerID is required by RFC2131.
require dhcp_server_identifier
