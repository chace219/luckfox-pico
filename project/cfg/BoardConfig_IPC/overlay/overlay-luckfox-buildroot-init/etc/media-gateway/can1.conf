# /etc/media-gateway/can1.conf — link settings for the SECOND CAN channel.
#
# Deliberately NOT in gateway.conf: the configuration page's CGI
# (www/cgi-bin/config.sh) rewrites gateway.conf wholesale on every
# "Save & Apply", so a [can_bus1] section added there would be silently
# dropped the first time an operator saved the page. Keeping can1 in its own
# file means the web UI owns can0 and this file owns can1, with no overlap.
#
# can1 is the mcp251xfd on spi0.2 (GPIO2_A4 CS / GPIO2_A5 INT). The media-gateway
# daemon does NOT read this file and does not use can1 — CAN_IFACE is fixed to
# "can0" at compile time (include/media_gateway.h). This file only configures
# the link so can1 is up and usable by candump/cansend and any local tooling.
#
# Keys mirror gateway.conf's [can_bus] names so both channels read alike.

[can_bus]
can1_enabled=true            # false = leave can1 down at boot
can_fd=true                  # CAN FD (bench-verified on this channel)
can_arb_bitrate=500000       # nominal / arbitration bitrate
can_data_bitrate=2000000     # FD data-phase bitrate (when can_fd=true)
can_arb_sample_point=80      # percent
can_data_sample_point=80     # percent
