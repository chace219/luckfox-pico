# /etc/media-gateway/can-routes.conf — J1939/CAN routing rules between ports.
#
# Turns the device into a PGN filter and/or bit-rate converter: frames matching
# a route's PGN whitelist are forwarded from src to dst by the KERNEL CAN
# gateway (CONFIG_CAN_GW). Nothing traverses userspace, so the media-gateway
# daemon is not in the data path and its state does not affect routing.
#
# Because each port has its own bit rate (gateway.conf for can0, can1.conf for
# can1), a route between ports at different rates IS the bit-rate conversion —
# there is no separate setting for it.
#
# Deliberately NOT in gateway.conf: the configuration page's CGI rewrites that
# file wholesale on every "Save & Apply" (see can1.conf for the same reasoning).
#
# Applied at boot by S99canroutes; re-apply after editing with:
#     /etc/init.d/S99canroutes restart
#
# ── Format ────────────────────────────────────────────────────────────────
#   [route:<name>]        <name> is free-form, for logs only
#   enabled=true|false
#   src=<iface>           source port
#   dst=<iface>           destination port
#   pgns=<list>           comma-separated PGNs. Each may be
#                           - a J1939 acronym: EEC1, CCVS, ET1 (case-insensitive)
#                           - a decimal number: 61444
#                           - a hex number:     0xF004
#                         Names come from /usr/share/media-gateway/j1939-pgns.tsv;
#                         any PGN can be given as a number whether or not it is
#                         listed there. Empty list = route nothing (fail closed).
#   mode=whitelist|blacklist
#                         whitelist: pass ONLY these PGNs (default)
#                         blacklist: pass everything EXCEPT these
#
# Priority and source address are always ignored when matching, so a PGN passes
# from any ECU at any priority — the correct behaviour for a chassis tap.
#
# Routing is per-direction: to bridge both ways, define two routes. Each has its
# own PGN list, so the directions need not be symmetric.
#
# ── Bench/default example ─────────────────────────────────────────────────
# Chassis (can0) -> output (can1): pass only engine speed and wheel speed.

[route:chassis_to_out]
enabled=true
src=can0
dst=can1
mode=whitelist
pgns=EEC1,CCVS               # engine speed, wheel speed (61444, 65265)

# Reverse direction, off by default: a chassis tap should not inject onto the
# truck bus unless that is explicitly wanted. Note can0 must NOT be listen-only
# for this route to physically transmit (see can0's listen_only setting).

[route:out_to_chassis]
enabled=false
src=can1
dst=can0
mode=whitelist
pgns=
