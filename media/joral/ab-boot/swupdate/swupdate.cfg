/*
 * /etc/swupdate.cfg — SWUpdate runtime defaults for Joral edge units.
 *
 * SWUpdate here is NOT a daemon (S80swupdate is inert): the product web
 * consoles run `swupdate -i <file.swu> -e stable,<slot>` per update. This
 * file pins the settings that must not depend on the caller getting the
 * command line right — above all the trust anchors.
 */
globals: {
	verbose = false;
	syslog = true;
	/* CMS verification against the shipped trust store — two certs
	 * (active + rollover spare, policy A.1). A DEV-keyed store is a
	 * pre-ship gate violation; see firmware-signing-and-support-policy.md. */
	public-key-file = "/etc/swupdate/trusted-certs.pem";
};
