/*
 * /etc/swupdate.cfg — SWUpdate runtime defaults for Joral edge units.
 *
 * SWUpdate here is NOT a daemon (S80swupdate is inert): the product web
 * consoles run `swupdate -i <file.swu> -e stable,<slot>` per update. This
 * file pins the settings that must not depend on the caller getting the
 * command line right — above all the trust anchors.
 */
globals: {
	verbose = false;
	/* MUST be set explicitly. `loglevel` is read into a zero-initialised
	 * swcfg, and OFF is 0 -- so OMITTING this key does not fall back to
	 * the binary's own `int loglevel = ERRORLEVEL` default, it OVERWRITES
	 * it with OFF once this file is parsed (swupdate.c: `loglevel =
	 * swcfg.verbose ? TRACELEVEL : swcfg.loglevel`). Every ERROR() is
	 * gated on `loglevel >= ERRORLEVEL`, so at OFF the installer fails
	 * SILENTLY: syslog = true cannot help, the syslog notifier sits
	 * behind the same gate. Merely HAVING a swupdate.cfg is what silences
	 * it, which is why this looks like a working config.
	 *
	 * What that cost (bench 2026-09-11): a failing install reported only
	 * "swupdate_image_write failed: Connection reset by peer" -- the
	 * perror() from the IPC feeder, plain libc and so not behind the
	 * macro. That is the SYMPTOM of the installer aborting mid-stream and
	 * closing the socket; the ERROR() line naming the actual cause was
	 * discarded. INFOLEVEL also keeps the "Installing image ... into
	 * volume" notify(), which tells support which slot was targeted. */
	loglevel = 3;   /* INFOLEVEL */
	syslog = true;
	/* CMS verification against the shipped trust store — two certs
	 * (active + rollover spare, policy A.1). A DEV-keyed store is a
	 * pre-ship gate violation; see firmware-signing-and-support-policy.md. */
	public-key-file = "/etc/swupdate/trusted-certs.pem";
};
